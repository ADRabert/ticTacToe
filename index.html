<html><head>
	<link href="assets/style.css" rel="stylesheet">
	<title>Tic-Tac-Toe</title>
</head><body>
	<h1 id="output">Tic-Tac-Toe</h1>

	<div id="container">
		<div class="top scores">
			<span>
				<h3><ion-icon name="close-sharp"></ion-icon> Score</h3>
				<p class="score">0</p>
			</span><span id="ties">
				<h3>Ties</h3>
				<p class="score">0</p>
			</span><span>
				<h3><ion-icon name="ellipse-outline"></ion-icon> Score</h3>
				<p class="score">0</p>
			</span>
		</div>

		<div id="board">
			<button class="square"></button>
			<button class="square"></button>
			<button class="square"></button>
			<button class="square"></button>
			<button class="square"></button>
			<button class="square"></button>
			<button class="square" id="bottomLeft"></button>
			<button class="square"></button>
			<button class="square" id="bottomRight"></button>
		</div>
	</div>

	<button id="newGame" style="display: none;">New Game</button>
	<h2 id="currPlayer">Current player: <ion-icon name="close-sharp"></ion-icon></h2>
</body></html>
<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
<script src="assets/script.js"></script>
