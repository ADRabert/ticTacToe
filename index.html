<html><head>
	<link href="assets/style.css" rel="stylesheet">
	<title>Tic-Tac-Toe</title>
</head><body>
	<h1 id="output">Tic-Tac-Toe</h1>

	<div id="container">
		<div class="top scores">
			<span>
				<p>X score:</p>
				<p class="score">0</p>
			</span>
            <span id="ties">
				<p>Ties:</p>
				<p class="score">0</p>
			</span>
            <span>
				<p>O score:</p>
				<p class="score">0</p>
			</span>
		</div>

		<div id="board">
			<button class="square"></button>
			<button class="square"></button>
			<button class="square rightSquare"></button>
			<button class="square"></button>
			<button class="square"></button>
			<button class="square rightSquare"></button>
			<button class="square" id="bottomLeft"></button>
			<button class="square"></button>
			<button class="square rightSquare" id="bottomRight"></button>
		</div>
	</div>

	<button id="newGame" style="display: none;">New Game</button>
	<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
	<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body></html>
<script src="assets/script.js"></script>
